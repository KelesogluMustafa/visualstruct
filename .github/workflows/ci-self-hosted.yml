# Generated by RunnerManager from .github/workflows/ci.yml: the same steps, run on this computer's registered runner.
# The original workflow is unchanged. This file is yours to edit.
name: CI (self-hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (self-hosted)
    runs-on: [self-hosted, Windows, X64, visualstruct]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build release files
        run: npm run release:pack
